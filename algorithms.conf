# Single source of truth for every algorithm in the benchmark.
# Steps 2, 3 and 4 all read this file, so a name is written exactly once.
#
# category : ROS1 | ROS2 | NON_ROS
# repo     : GitHub repository under https://github.com/MapsHD
# id       : short name. Used for the data folder (data/<id>), the run script
#            (docker_session_run-<ros1|ros2|->-<id>.sh) and, lowercased, the
#            Docker image tag (<id>_noetic / _humble / _standalone).
#            Docker forbids uppercase in image names, hence the lowercasing.
# output   : folder the algorithm's converter writes, without the
#            'output_hdmapping-' prefix. Set by each algorithm's own repo, so
#            it often differs from the id. Empty = no automated output.
# input    : raw = the ROS1 bag, pc = the aggregated -pc.bag,
#            ros2 = the ROS2 bag dir, ros2-lidar = the -lidar ROS2 bag dir.
#
# category | repo | id | output | input
