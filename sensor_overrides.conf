# Per-sensor run settings for algorithms whose canonical-bag defaults do not fit
# every dataset. The canonical bag always has the same topics and fields
# (/lidar/pointcloud: x y z intensity ring time t; /lidar/imu), but what is in
# it depends on the lidar that recorded the dataset:
#
#   qt64   : Hesai QT64 + Alphasense IMU (Oxford Spires). 64 rings, 104 deg
#            vertical FOV, IMU 400 Hz. Default; every algorithm's canonical
#            branch defaults are written for it, so it needs no rows here.
#   mid360 : Livox Mid-360 with its built-in IMU (HUMANOID-LIO, Mandeye raw
#            data). Non-repetitive scan, ring always 0, about -7..52 deg
#            vertical FOV, IMU 200 Hz.
#
# The dataset's sensor is CANONICAL_SENSOR if set, else the first word of
# <data dir>/canonical_sensor, else qt64 (see canonical_sensor in algos_lib.sh).
#
# Step 3 runs each algorithm with the VAR=value settings of its row for that
# sensor, for that algorithm only (nothing is exported to the other algorithms).
# The variables are read by the algorithm's own run script; see its repo.
#
# sensor | id | VAR=value [VAR=value ...]
mid360 | ellipselio | CONFIG_FILE=canonical_mid360.yaml
mid360 | nv-liom    | NV_LIOM_LAUNCH=nv_liom_canonical_mid360.launch
